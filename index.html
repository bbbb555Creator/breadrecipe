<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunのパン工房</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#c2410c">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-title" content="Bunのパン工房">
    <style>
        :root {
            --bg:#FFF9F2; --card:#FFFFFF; --primary:#C2410C; --primary-dark:#9A3412;
            --ink:#431407; --ink-sub:#8A5A3B; --line:#F0E0CF; --chip:#FDEBD7;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { background:var(--bg); color:var(--ink); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
        .phone { max-width:430px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; }
        .hidden { display:none !important; }

        /* 一覧 */
        header { padding:22px 20px 14px; border-bottom:1px solid var(--line); }
        .app-name { font-size:20px; font-weight:800; }
        .app-sub { font-size:12px; color:var(--ink-sub); margin-top:3px; }
        .guide-btn { display:block; width:calc(100% - 40px); margin:14px 20px 0; min-height:44px; border:none; border-radius:12px;
                     background:var(--primary); color:#fff; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
        .search { margin:14px 20px 6px; background:#fff; border:1px solid var(--line); border-radius:12px;
                  display:flex; align-items:center; gap:8px; padding:0 14px; height:46px; }
        .search input { border:none; outline:none; font-size:16px; flex:1; color:var(--ink); background:transparent; font-family:inherit; }
        .search input::placeholder { color:#C9A186; }
        .list { padding:6px 20px 28px; }
        .phone.timer-on .list { padding-bottom:120px; }
        .row { display:flex; align-items:center; gap:14px; width:100%; min-height:76px; padding:12px 0;
               background:none; border:none; border-bottom:1px solid var(--line); cursor:pointer;
               text-align:left; font-family:inherit; color:var(--ink); }
        .row img { width:64px; height:64px; border-radius:12px; object-fit:cover; flex:none;
                   box-shadow:0 2px 6px rgba(154,52,18,.12); }
        .row-main { flex:1; min-width:0; }
        .row-name { display:block; font-size:16px; font-weight:700; line-height:1.35; }
        .row-count { display:block; font-size:12px; color:var(--ink-sub); margin-top:3px; }
        .row-arrow { font-size:22px; color:#D9B48F; flex:none; }
        .empty { text-align:center; color:var(--ink-sub); font-size:14px; padding:24px 0; line-height:1.7; }
        .retry-btn { margin-top:10px; min-height:44px; padding:0 22px; border:none; border-radius:999px; background:var(--primary);
                     color:#fff; font-size:14px; font-weight:800; cursor:pointer; font-family:inherit; }
        .note { font-size:11px; color:#C9A186; text-align:center; padding:0 20px 20px; }

        /* 詳細 */
        .back { display:flex; align-items:center; min-height:44px; padding:8px 16px 0;
                color:var(--primary); font-size:15px; font-weight:700; background:none; border:none; cursor:pointer; font-family:inherit; }
        .hero { width:100%; height:132px; object-fit:cover; display:block; margin-top:6px; }
        .detail-body { padding:16px 20px 110px; }
        .phone.timer-on .detail-body { padding-bottom:180px; }
        .d-title { font-size:21px; font-weight:800; line-height:1.3; }
        .d-meta { font-size:13px; color:var(--ink-sub); margin-top:4px; }
        .stepper-row { display:flex; align-items:center; justify-content:space-between; margin:16px 0 2px; }
        .stepper-label { font-size:14px; font-weight:700; }
        .stepper { display:flex; align-items:center; gap:12px; }
        .stepper button { width:44px; height:44px; border-radius:12px; border:1px solid var(--line); cursor:pointer;
                          background:#fff; color:var(--primary-dark); font-size:20px; font-weight:800; font-family:inherit; }
        .stepper input.num { width:58px; text-align:center; font-size:17px; font-weight:800; border:none; background:transparent;
                             color:var(--ink); font-family:inherit; outline:none; }
        input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
        input[type=number] { -moz-appearance:textfield; appearance:textfield; }
        h2.sec { font-size:16px; font-weight:800; margin:22px 0 10px; padding-bottom:6px; border-bottom:2px solid var(--chip); }
        h3.cat { font-size:13px; font-weight:800; color:var(--primary); margin:14px 0 6px; }
        .hint { font-size:11px; color:#C9A186; margin:-2px 0 6px; line-height:1.6; }
        .ing-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        .ing { background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; min-height:58px;
               cursor:pointer; text-align:left; font-family:inherit; width:100%; color:var(--ink); }
        .ing .n { display:block; font-size:12.5px; color:var(--ink-sub); line-height:1.35; }
        .ing .a { display:block; font-size:16px; font-weight:800; margin-top:2px; color:var(--ink); }
        .ing.done { background:var(--chip); border-color:#F3C48D; }
        .ing.done .n, .ing.done .a { color:#B98A5F; text-decoration:line-through; }
        .step { display:flex; gap:14px; padding:14px 10px; border-radius:14px; cursor:pointer; }
        .step .no { flex:none; width:28px; height:28px; border-radius:50%; border:2px solid #EBCBAA; color:var(--ink-sub);
                    font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-top:2px; background:#fff; }
        .step p { font-size:16.5px; line-height:1.8; }
        .step.now { background:#fff; box-shadow:0 4px 14px rgba(154,52,18,.10); }
        .step.now .no { background:var(--primary); border-color:var(--primary); color:#fff; }
        .step.now p { font-weight:600; }
        .step.done p { color:var(--ink-sub); text-decoration:line-through; }
        .step.done .no { background:var(--chip); border-color:#F3C48D; color:var(--ink-sub); }
        .chip { display:inline-block; background:var(--chip); color:var(--primary-dark); font-weight:800; font-size:13.5px;
                border:1.5px solid #F0BE8A; border-radius:999px; padding:0 10px; margin:0 2px; white-space:nowrap;
                cursor:pointer; font-family:inherit; appearance:none; -webkit-appearance:none; }

        /* タイマーバー（下部固定） */
        .timerbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; z-index:40;
                    background:var(--primary-dark); color:#fff; display:flex; align-items:center; gap:12px;
                    padding:12px 18px calc(12px + env(safe-area-inset-bottom)); box-shadow:0 -4px 16px rgba(67,20,7,.25); }
        .timerbar .t-label { font-size:11px; opacity:.75; }
        .timerbar .t-time { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1; }
        .timerbar .t-main { flex:1; }
        .timerbar button { min-height:46px; padding:0 20px; border:none; border-radius:999px; background:#fff;
                           color:var(--primary-dark); font-size:15px; font-weight:800; cursor:pointer; font-family:inherit; }

        /* 終了オーバーレイ */
        .overlay { position:fixed; inset:0; z-index:60; background:rgba(67,20,7,.45); display:flex; align-items:center; justify-content:center; padding:16px; }
        .overlay-card { background:#fff; border-radius:24px; padding:32px; text-align:center; box-shadow:0 20px 50px rgba(67,20,7,.3); max-width:320px; width:100%; }
        .overlay-bell { font-size:56px; margin-bottom:16px; }
        .overlay-text { font-size:20px; font-weight:800; color:var(--ink); margin-bottom:24px; }
        .overlay-btn { width:100%; min-height:52px; border:none; border-radius:16px; background:var(--primary); color:#fff;
                       font-size:17px; font-weight:800; cursor:pointer; font-family:inherit; }
    </style>
</head>
<body>
    <div class="phone" id="phone">

        <!-- 一覧画面 -->
        <div id="view-list">
            <button id="guideBtn" class="guide-btn">📱 ホーム画面に追加する方法</button>
            <header>
                <div class="app-name">🍞 Bunのパン工房</div>
                <div class="app-sub" id="appSub">レシピ一覧</div>
            </header>
            <div class="search">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="レシピを検索..." oninput="filterRecipes()">
            </div>
            <div id="recipeList" class="list">
                <p class="empty">読み込み中...</p>
            </div>
        </div>

        <!-- 詳細画面 -->
        <div id="view-detail" class="hidden">
            <button class="back" onclick="showList()">‹ レシピ一覧</button>
            <div id="recipeImageContainer" class="hidden">
                <img id="recipeImage" class="hero" src="" alt="レシピ写真" onerror="document.getElementById('recipeImageContainer').classList.add('hidden')">
            </div>
            <div class="detail-body">
                <div class="d-title" id="recipeTitle"></div>
                <div class="d-meta">元のレシピ <span id="baseCountDisplay">0</span>個分</div>

                <div class="stepper-row">
                    <div class="stepper-label">作りたい個数</div>
                    <div class="stepper">
                        <button type="button" onclick="changeCount(-1)" aria-label="減らす">−</button>
                        <input type="number" id="targetCount" class="num" value="4" oninput="calculate()">
                        <button type="button" onclick="changeCount(1)" aria-label="増やす">＋</button>
                    </div>
                </div>

                <h2 class="sec">材料</h2>
                <div id="ingredientList"></div>

                <h2 class="sec">作り方</h2>
                <p class="hint">※色付きの分数はタップでタイマー開始<br>※ステップをタップすると「済み」になります</p>
                <div id="procedureList"></div>
            </div>
        </div>

        <!-- タイマーバー -->
        <div id="timerContainer" class="timerbar hidden">
            <div class="t-main">
                <div class="t-label">残り時間</div>
                <div id="timerDisplay" class="t-time">00:00</div>
            </div>
            <button type="button" onclick="stopTimer()">停止</button>
        </div>

        <!-- 終了オーバーレイ -->
        <div id="finishOverlay" class="overlay hidden">
            <div class="overlay-card">
                <div class="overlay-bell">🔔</div>
                <p class="overlay-text">時間だよ！</p>
                <button type="button" class="overlay-btn" onclick="dismissAlarm()">OK</button>
            </div>
        </div>

    </div>

    <script>
        // --- ホーム画面追加用のロジック ---
        const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
        if (isStandalone) {
            document.getElementById('guideBtn').classList.add('hidden');
        }

        document.getElementById('guideBtn').addEventListener('click', () => {
            const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            if (isiOS) {
                alert("【iPhoneでの追加方法】\n\n1. 画面下の「共有」ボタンをタップ。\n2. メニューを下にスクロール。\n3. 「ホーム画面に追加」を選択。\n4. 右上の「追加」を押してね！");
            } else {
                alert("【Androidでの追加方法】\n\n1. ブラウザ右上の「︙」メニューをタップ。\n2. 「アプリをインストール」または「ホーム画面に追加」を選択してね！");
            }
        });

        // --- レシピ機能 ---
        let allRecipes = [];
        let currentRecipeKey = "";
        let timerInterval;
        let checkedIngs = new Set();
        let stepDone = new Set();
        let detailOpen = false;
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxPf6aGtE_j5qRRLuV6tjJ8aMOjaRQfBri3kOsDJ9dmteRgSuQ_7Kerizpi-X79eUaF/exec';

        const CACHE_KEY = 'breadRecipesCacheV1';
        async function fetchRecipes() {
            // 前回のデータがあれば先に表示する（開いてすぐ使えるように）
            if (!allRecipes.length) {
                try {
                    const cached = localStorage.getItem(CACHE_KEY);
                    if (cached) {
                        allRecipes = JSON.parse(cached).sort((a, b) => a.menu.localeCompare(b.menu, 'ja'));
                        renderRecipeList(allRecipes);
                    }
                } catch (e) {}
            }
            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                const keep = currentRecipeKey;
                allRecipes = data.sort((a, b) => a.menu.localeCompare(b.menu, 'ja'));
                try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
                renderRecipeList(allRecipes);
                if (keep && allRecipes.some(r => r.menu === keep)) {
                    currentRecipeKey = keep;
                    if (detailOpen) { stopTimer(); loadRecipe(); }
                }
            } catch (e) {
                if (!allRecipes.length) {
                    document.getElementById('recipeList').innerHTML = '<p class="empty">読み込み失敗...<br><button type="button" onclick="fetchRecipes()" class="retry-btn">もう一度読み込む</button></p>';
                }
            }
        }

        function renderRecipeList(recipes) {
            document.getElementById('appSub').textContent = 'レシピ ' + allRecipes.length + ' 件';
            const container = document.getElementById('recipeList');
            container.innerHTML = '';
            if (!recipes.length) {
                container.innerHTML = '<p class="empty">該当するレシピがありません</p>';
                return;
            }
            recipes.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'row';
                let inner = '';
                if (item.image) {
                    inner += `<img src="https://lh3.googleusercontent.com/d/${item.image}" alt="${item.menu}" loading="lazy" onerror="this.style.display='none'">`;
                }
                inner += `<span class="row-main"><span class="row-name">${item.menu}</span><span class="row-count">${item.baseCount}個分</span></span><span class="row-arrow">›</span>`;
                btn.innerHTML = inner;
                btn.onclick = () => selectRecipe(item.menu);
                container.appendChild(btn);
            });
        }

        function filterRecipes() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allRecipes.filter(item => item.menu.toLowerCase().includes(keyword));
            renderRecipeList(filtered);
        }

        function selectRecipe(menuName) {
            currentRecipeKey = menuName;
            stopTimer();
            detailOpen = true;
            document.getElementById('view-list').classList.add('hidden');
            document.getElementById('view-detail').classList.remove('hidden');
            loadRecipe();
            requestWakeLock();
            window.scrollTo(0, 0);
        }

        function showList() {
            detailOpen = false;
            document.getElementById('view-detail').classList.add('hidden');
            document.getElementById('view-list').classList.remove('hidden');
            releaseWakeLock();
            window.scrollTo(0, 0);
        }

        function loadRecipe() {
            const recipe = allRecipes.find(r => r.menu === currentRecipeKey);
            if (!recipe) return;
            const imgContainer = document.getElementById('recipeImageContainer');
            if (recipe.image) {
                document.getElementById('recipeImage').src = "https://lh3.googleusercontent.com/d/" + recipe.image;
                imgContainer.classList.remove('hidden');
            } else { imgContainer.classList.add('hidden'); }

            document.getElementById('recipeTitle').textContent = recipe.menu;
            document.getElementById('targetCount').value = recipe.baseCount;
            document.getElementById('baseCountDisplay').innerText = recipe.baseCount;

            checkedIngs = new Set();
            stepDone = new Set();

            const procContainer = document.getElementById('procedureList');
            procContainer.innerHTML = '';
            let g = 0;
            (recipe.procedures || []).forEach(s => {
                procContainer.innerHTML += `<h3 class="cat">【${s.section}】</h3>`;
                s.steps.forEach((step, i) => {
                    const linkedStep = step.replace(/(\d+)[\s\u3000\n]*分(?![割の])/g, (match, p1) => `<button type="button" class="chip" data-min="${p1}">▶ ${p1}分</button>`);
                    procContainer.innerHTML += `<div class="step" data-gidx="${g}"><div class="no">${i+1}</div><p>${linkedStep}</p></div>`;
                    g++;
                });
            });
            updateStepStates();
            calculate();
        }

        function updateStepStates() {
            const steps = document.getElementById('procedureList').querySelectorAll('.step');
            let nowSet = false;
            steps.forEach(el => {
                const idx = parseInt(el.dataset.gidx, 10);
                const isDone = stepDone.has(idx);
                el.classList.toggle('done', isDone);
                const isNow = !isDone && !nowSet;
                if (isNow) nowSet = true;
                el.classList.toggle('now', isNow);
            });
        }

        function toggleStep(gidx) {
            if (stepDone.has(gidx)) stepDone.delete(gidx); else stepDone.add(gidx);
            updateStepStates();
        }

        // 分量の換算：数字が1つだけで、範囲・分数・長さ(cm/mm)でないものだけを、
        // 数字の位置を変えずに換算する。それ以外は原文のまま表示する。
        function scaleAmount(amount, ratio) {
            const s = amount.toString();
            if (/[~～〜\/×]/.test(s) || /cm|mm/.test(s)) return s;
            const nums = s.match(/\d+(?:\.\d+)?/g);
            if (!nums || nums.length !== 1) return s;
            const val = parseFloat(nums[0]) * ratio;
            const text = Number.isInteger(val) ? String(val) : val.toFixed(1).replace(/\.0$/, '');
            return s.replace(nums[0], text);
        }

        function changeCount(d) {
            const input = document.getElementById('targetCount');
            const recipe = allRecipes.find(r => r.menu === currentRecipeKey);
            const raw = parseFloat(input.value);
            const cur = (isNaN(raw) || raw <= 0) ? (recipe ? recipe.baseCount : 1) : raw;
            input.value = Math.max(1, cur + d);
            calculate();
        }

        function calculate() {
            const targetCount = parseFloat(document.getElementById('targetCount').value);
            const recipe = allRecipes.find(r => r.menu === currentRecipeKey);
            if (!recipe || !recipe.ingredients) return;
            const target = (isNaN(targetCount) || targetCount <= 0) ? recipe.baseCount : targetCount;
            const ratio = target / recipe.baseCount;
            const container = document.getElementById('ingredientList');
            container.innerHTML = '';
            Object.keys(recipe.ingredients).forEach(category => {
                const items = recipe.ingredients[category];
                const categoryNames = { base: '生地', boiling: '茹でる用', filling: 'フィリング' };
                container.innerHTML += `<h3 class="cat">【${categoryNames[category] || category}】</h3>`;
                let grid = '<div class="ing-grid">';
                items.forEach((item, idx) => {
                    const display = scaleAmount(item.amount, ratio);
                    const key = category + ':' + idx;
                    const done = checkedIngs.has(key) ? ' done' : '';
                    grid += `<button type="button" class="ing${done}" data-key="${key}"><span class="n">${item.name}</span><span class="a">${display}</span></button>`;
                });
                grid += '</div>';
                container.innerHTML += grid;
            });
        }

        // --- 画面スリープ防止（Wake Lock） ---
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                }
            } catch (e) {}
        }
        function releaseWakeLock() {
            try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
        }
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && detailOpen && !wakeLock) requestWakeLock();
        });

        // --- 材料チェック／手順タップ（イベント委譲） ---
        document.getElementById('ingredientList').addEventListener('click', (e) => {
            const ing = e.target.closest('.ing');
            if (!ing) return;
            const key = ing.dataset.key;
            if (checkedIngs.has(key)) checkedIngs.delete(key); else checkedIngs.add(key);
            ing.classList.toggle('done', checkedIngs.has(key));
        });
        document.getElementById('procedureList').addEventListener('click', (e) => {
            const chip = e.target.closest('button.chip');
            if (chip) { startTimer(parseInt(chip.dataset.min, 10)); return; }
            const stepEl = e.target.closest('.step');
            if (stepEl) toggleStep(parseInt(stepEl.dataset.gidx, 10));
        });

        let audioCtx = null;
        function ensureAudio() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {}
        }
        // タイマー音は「音声ファイルの再生」方式を主に使う。
        // iPhoneではWeb Audio方式の音がマナーモードで消音されるが、
        // 動画などと同じ音声再生の経路はマナーモードでも鳴るため。
        let alarmAudio = null;
        let alarmRepeatId = null;
        function wavUrlFromSamples(samples, rate) {
            const total = samples.length;
            const buffer = new ArrayBuffer(44 + total * 2);
            const view = new DataView(buffer);
            const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
            writeStr(0, 'RIFF'); view.setUint32(4, 36 + total * 2, true); writeStr(8, 'WAVE');
            writeStr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            writeStr(36, 'data'); view.setUint32(40, total * 2, true);
            for (let i = 0; i < total; i++) {
                const v = Math.max(-1, Math.min(1, samples[i]));
                view.setInt16(44 + i * 2, Math.round(v * 32767), true);
            }
            return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
        }
        function makeBeepWavUrl() {
            // 文吾が送ってくれたキッチンタイマーのサンプル音を実測して再現：
            // 約2050Hzの短い電子音（0.065秒）を0.125秒間隔で4回、1秒周期で繰り返す。
            const rate = 22050;
            const freq = 2050;
            const beepLen = 0.065, spacing = 0.125, count = 4;
            const total = rate * 1; // 1周期＝1秒
            const samples = new Float32Array(total);
            for (let i = 0; i < count; i++) {
                const start = Math.floor(rate * i * spacing);
                const len = Math.floor(rate * beepLen);
                for (let j = 0; j < len; j++) {
                    const t = j / rate;
                    const env = Math.min(1, j / (rate * 0.002), (len - j) / (rate * 0.01));
                    const tone = Math.sin(2 * Math.PI * freq * t) + 0.55 * Math.sin(2 * Math.PI * freq * 2 * t);
                    samples[start + j] = (tone / 1.55) * 0.95 * env;
                }
            }
            return wavUrlFromSamples(samples, rate);
        }
        function makeSilentWavUrl() {
            const rate = 22050;
            return wavUrlFromSamples(new Float32Array(Math.floor(rate * 0.15)), rate);
        }
        let alarmWavUrl = null;
        let alarmPrimed = false;
        function primeAlarm() {
            // タイマー開始のタップの中で一度だけ「無音の音声」を再生し、終了時に鳴らせるよう解錠しておく。
            // iPhoneはプログラムからの音量変更が効かない（音量0作戦が使えない）ため、
            // 音量ではなく「音そのものが無音のクリップ」を使う。
            try {
                if (!alarmWavUrl) alarmWavUrl = makeBeepWavUrl();
                if (!alarmAudio) {
                    alarmAudio = new Audio();
                    alarmAudio.preload = 'auto';
                }
                if (alarmPrimed) return;
                alarmAudio.src = makeSilentWavUrl();
                const p = alarmAudio.play();
                if (p) p.then(() => {
                    try { alarmAudio.pause(); alarmAudio.currentTime = 0; } catch (e) {}
                    alarmPrimed = true;
                }).catch(() => {});
            } catch (e) {}
        }
        function playAlarm() {
            if (navigator.vibrate) { try { navigator.vibrate([300, 100, 300, 100, 300]); } catch (e) {} }
            let elementStarted = false;
            if (alarmAudio) {
                try {
                    if (alarmWavUrl && alarmAudio.src !== alarmWavUrl) alarmAudio.src = alarmWavUrl;
                    alarmAudio.loop = true;
                    try { alarmAudio.currentTime = 0; } catch (e) {}
                    const p = alarmAudio.play();
                    elementStarted = true;
                    if (p) p.catch(() => { ringWebAudio(); });
                } catch (e) {}
            }
            if (elementStarted) return;
            ringWebAudio();
        }
        function ringWebAudio() {
            if (!audioCtx) return;
            const ringOnce = () => {
                try {
                    const t0 = audioCtx.currentTime;
                    [0, 0.125, 0.25, 0.375].forEach(off => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = 2050;
                        gain.gain.setValueAtTime(0.0001, t0 + off);
                        gain.gain.exponentialRampToValueAtTime(0.4, t0 + off + 0.005);
                        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.065);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(t0 + off);
                        osc.stop(t0 + off + 0.075);
                    });
                } catch (e) {}
            };
            ringOnce();
            clearInterval(alarmRepeatId);
            alarmRepeatId = setInterval(ringOnce, 1000);
        }
        function stopAlarm() {
            if (alarmAudio) {
                try { alarmAudio.pause(); alarmAudio.currentTime = 0; } catch (e) {}
            }
            clearInterval(alarmRepeatId);
            alarmRepeatId = null;
        }

        function startTimer(minutes) {
            ensureAudio();
            primeAlarm();
            stopTimer();
            document.getElementById('timerContainer').classList.remove('hidden');
            document.getElementById('phone').classList.add('timer-on');
            let seconds = minutes * 60;
            document.getElementById('timerDisplay').innerText = `${String(minutes).padStart(2, '0')}:00`;
            timerInterval = setInterval(() => {
                seconds--;
                let m = Math.floor(seconds / 60);
                let s = seconds % 60;
                document.getElementById('timerDisplay').innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                if (seconds <= 0) { clearInterval(timerInterval); playAlarm(); document.getElementById('finishOverlay').classList.remove('hidden'); }
            }, 1000);
        }

        function stopTimer() {
            stopAlarm();
            clearInterval(timerInterval);
            document.getElementById('timerContainer').classList.add('hidden');
            document.getElementById('phone').classList.remove('timer-on');
        }
        function dismissAlarm() {
            stopAlarm();
            document.getElementById('finishOverlay').classList.add('hidden');
            document.getElementById('timerContainer').classList.add('hidden');
            document.getElementById('phone').classList.remove('timer-on');
        }

        fetchRecipes();
    </script>
</body>
