<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunのパン工房</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="orange">
    <meta name="apple-mobile-web-app-title" content="Bunのパン工房">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-3xl shadow-lg p-6">
        
        <button id="guideBtn" class="w-full bg-orange-600 text-white font-bold py-2 rounded-xl mb-6 text-sm hover:bg-orange-700 transition">
            📱 ホーム画面に追加する方法
        </button>

        <h1 class="text-2xl font-bold text-orange-800 mb-6 text-center">🍞 Bunのパン工房</h1>

        <div class="mb-6">
            <input type="text" id="searchInput" oninput="filterRecipes()" 
                   placeholder="🔍 レシピを検索..." 
                   class="w-full p-4 rounded-xl border-2 border-orange-200 focus:border-orange-500 outline-none text-orange-900">
        </div>

        <div id="recipeList" class="space-y-2 mb-6 max-h-60 overflow-y-auto pr-2">
            <p class="text-orange-500 text-center">読み込み中...</p>
        </div>

        <div id="finishOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
            <div class="bg-white p-8 rounded-3xl text-center shadow-2xl max-w-xs w-full">
                <div class="text-6xl mb-4">🔔</div>
                <p class="text-xl font-bold text-orange-900 mb-6">時間だよ！</p>
                <button onclick="dismissAlarm()" class="w-full bg-orange-600 text-white font-bold py-4 rounded-2xl text-lg hover:bg-orange-700 transition">OK</button>
            </div>
        </div>

        <div id="recipeImageContainer" class="mb-6 hidden bg-white p-2 rounded-2xl shadow-inner">
            <img id="recipeImage" src="" alt="レシピ写真" class="w-full h-64 object-cover rounded-2xl shadow-md">
        </div>

        <div class="bg-orange-100 p-5 rounded-2xl mb-6">
            <div class="flex justify-between items-center mb-4">
                <span class="text-sm text-orange-800">元レシピ個数: <span id="baseCountDisplay" class="font-bold text-orange-950">0</span></span>
            </div>
            <label class="block text-sm font-bold text-orange-900 mb-2">作りたい個数</label>
            <input type="number" id="targetCount" value="4" oninput="calculate()" class="w-full p-4 rounded-xl border-2 border-orange-300 text-3xl font-bold text-center text-orange-900 focus:outline-none focus:border-orange-500">
        </div>

        <div id="ingredientList" class="space-y-2"></div>

        <div id="timerContainer" class="hidden my-6 p-4 bg-orange-800 rounded-2xl text-center text-white shadow-lg">
            <div class="text-xs font-bold opacity-80">残り時間</div>
            <div id="timerDisplay" class="text-4xl font-black my-1 tabular-nums">00:00</div>
            <button onclick="stopTimer()" class="text-xs bg-orange-700 hover:bg-orange-600 px-4 py-1 rounded-full mt-2 transition">停止</button>
        </div>

        <h3 id="procedureTitle" class="font-bold text-orange-900 mt-8 mb-2 hidden">作り方</h3>
        <p id="timerHint" class="text-[10px] text-orange-400 mb-2 hidden">※色付きの分数はタップでタイマー開始</p>
        <div id="procedureList" class="text-sm text-orange-800 space-y-2"></div>
    </div>

    <script>
        let allRecipes = [];
        let currentRecipeKey = ""; 
        let timerInterval;
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxPf6aGtE_j5qRRLuV6tjJ8aMOjaRQfBri3kOsDJ9dmteRgSuQ_7Kerizpi-X79eUaF/exec';

        async function fetchRecipes() {
            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                allRecipes = data.sort((a, b) => a.menu.localeCompare(b.menu, 'ja'));
                renderRecipeList(allRecipes);
                if (allRecipes.length > 0) selectRecipe(allRecipes[0].menu);
            } catch (e) { document.getElementById('recipeList').innerHTML = "読み込み失敗..."; }
        }

        function renderRecipeList(recipes) {
            const container = document.getElementById('recipeList');
            container.innerHTML = '';
            recipes.forEach(item => {
                const div = document.createElement('div');
                div.className = "p-4 bg-white rounded-xl border border-orange-200 shadow-sm cursor-pointer hover:bg-orange-100 transition";
                div.innerHTML = `<p class="font-bold text-orange-900">${item.menu}</p>`;
                div.onclick = () => selectRecipe(item.menu);
                container.appendChild(div);
            });
        }

        function filterRecipes() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allRecipes.filter(item => item.menu.toLowerCase().includes(keyword));
            renderRecipeList(filtered);
        }

        function selectRecipe(menuName) {
            currentRecipeKey = menuName;
            stopTimer();
            loadRecipe();
        }

        function loadRecipe() {
            const recipe = allRecipes.find(r => r.menu === currentRecipeKey);
            if (!recipe) return;
            const imgContainer = document.getElementById('recipeImageContainer');
            if (recipe.image) { 
                document.getElementById('recipeImage').src = "https://lh3.googleusercontent.com/d/" + recipe.image; 
                imgContainer.classList.remove('hidden'); 
            } else { imgContainer.classList.add('hidden'); }
            
            document.getElementById('targetCount').value = recipe.baseCount;
            document.getElementById('baseCountDisplay').innerText = recipe.baseCount;
            
            const procContainer = document.getElementById('procedureList');
            procContainer.innerHTML = '';
            document.getElementById('procedureTitle').classList.remove('hidden');
            document.getElementById('timerHint').classList.remove('hidden');
            
            recipe.procedures.forEach(s => {
                procContainer.innerHTML += `<h4 class="font-bold text-orange-950 mt-4">【${s.section}】</h4>`;
                s.steps.forEach((step, i) => {
                    const linkedStep = step.replace(/(\d+)[\s\u3000\n]*分(?![割の])/g, (match, p1) => `<button onclick="startTimer(${p1})" class="bg-orange-200 hover:bg-orange-300 text-orange-900 px-2 py-0.5 rounded-md font-bold transition underline decoration-orange-400">▶ ${p1}分</button>`);
                    procContainer.innerHTML += `<div class="text-sm py-1"><b>${i+1}.</b> ${linkedStep}</div>`;
                });
            });
            calculate();
        }

        function calculate() {
            const targetCount = parseFloat(document.getElementById('targetCount').value);
            const recipe = allRecipes.find(r => r.menu === currentRecipeKey);
            if (!recipe || !recipe.ingredients) return;
            const container = document.getElementById('ingredientList');
            container.innerHTML = '';
            Object.keys(recipe.ingredients).forEach(category => {
                const items = recipe.ingredients[category];
                const categoryNames = { base: '生地', boiling: '茹でる用', filling: 'フィリング' };
                container.innerHTML += `<div class="font-bold text-orange-800 mt-3 border-b border-orange-200">【${categoryNames[category] || category}】</div>`;
                items.forEach(item => {
                    const match = item.amount.toString().match(/([\d\.]+)/);
                    const val = match ? (parseFloat(match[1]) * targetCount) / recipe.baseCount : 0;
                    const display = match ? val.toFixed(1).replace('.0','') + item.amount.toString().replace(match[1], "") : item.amount;
                    container.innerHTML += `<div class="flex justify-between py-1 border-b border-orange-50"><span class="text-sm">${item.name}</span><span class="font-bold text-orange-900">${display}</span></div>`;
                });
            });
        }

        function startTimer(minutes) {
            stopTimer();
            document.getElementById('timerContainer').classList.remove('hidden');
            let seconds = minutes * 60;
            document.getElementById('timerDisplay').innerText = `${String(minutes).padStart(2, '0')}:00`;
            timerInterval = setInterval(() => {
                seconds--;
                let m = Math.floor(seconds / 60);
                let s = seconds % 60;
                document.getElementById('timerDisplay').innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                if (seconds <= 0) { clearInterval(timerInterval); document.getElementById('finishOverlay').classList.remove('hidden'); }
            }, 1000);
        }

        function stopTimer() { clearInterval(timerInterval); document.getElementById('timerContainer').classList.add('hidden'); }
        function dismissAlarm() { document.getElementById('finishOverlay').classList.add('hidden'); document.getElementById('timerContainer').classList.add('hidden'); }

        fetchRecipes();
    </script>
</body>
</html>
